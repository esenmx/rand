name: rand
description: >-
  Random data generator for Dart. Numbers, text, names, dates, CSS colors,
  cryptographic tokens. Static API, seedable, pure Dart, all platforms.
version: 4.0.0
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/rand
issue_tracker: https://github.com/esenmx/rand/issues
documentation: https://pub.dev/documentation/rand/latest/

topics:
  - random
  - testing
  - mock
  - generator
  - fixtures

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  checks: ^0.3.0
  test: ^1.28.0
  very_good_analysis: ^10.0.0
