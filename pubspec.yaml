name: rand
description: "Test-data generator: names, emails, IPv4/IPv6/MAC, hex, slugs, OTP, semver, lorem, CSS colors, geo, weighted samples, CSPRNG tokens. Pure Dart, seedable (non-crypto), LLM skill."
version: 4.2.0
homepage: https://mehmetesen.com
repository: https://github.com/esenmx/rand
issue_tracker: https://github.com/esenmx/rand/issues
documentation: https://pub.dev/documentation/rand/latest/

topics:
  - random
  - fixtures
  - fake-data
  - mock
  - testing

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  checks: ^0.3.0
  test: ^1.28.0
  very_good_analysis: ^10.0.0
